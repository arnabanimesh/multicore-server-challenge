[package]
name = "conduit"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-lc-rs = "1.19.0"
base64 = "0.23.1"
bcrypt = "0.19.3"
crossbeam-channel = "0.5.17"
httparse = "1.10.1"
itoa = "1.0.18"
libc = "0.2.191"
memchr = "2.8.3"
serde_json = "1.0.154"
socket2 = "0.6.5"
tikv-jemallocator = "0.7.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
tokio-postgres = "0.7.18"
urlencoding = "2.1.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
